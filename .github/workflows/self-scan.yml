# The guard runs its own scan on every push and PR: it must pass the rules it preaches.
name: Tripwire self-scan

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m pip install --quiet -e ".[test]"
          python -m pytest -q

  self-scan:
    # A called job may not request a permission the caller does not grant; `actions: read` is
    # required by the SARIF upload on private repositories. Keep this a superset of the called job.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/tripwire.yml
    with:
      tripwire-ref: ${{ github.sha }}
      # The reusable workflow defaults to the upstream repo; a fork must run its own copy.
      tripwire-repository: ${{ github.repository }}
      fail-on: medium        # the repo is clean at medium; keep it that way
      baseline: .tripwire-baseline.json   # one accepted finding: a fake test key in history (8cea2c3)
