# The guard runs its own scan on every push and PR: it must pass the rules it preaches.
name: Tripwire self-scan

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m pip install --quiet -e ".[test]"
          python -m pytest -q

  self-scan:
    # A called job may not request a permission the caller does not grant; `actions: read` is
    # required by the SARIF upload on private repositories. Keep this a superset of the called job.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/tripwire.yml
    with:
      tripwire-ref: ${{ github.sha }}
      # The reusable workflow defaults to the upstream repo; a fork must run its own copy.
      tripwire-repository: ${{ github.repository }}
      fail-on: medium        # the repo is clean at medium; keep it that way
      baseline: .tripwire-baseline.json   # one accepted finding: a fake test key in history (8cea2c3)
      criteria: .tripwire/criteria.yml     # per-criterion pass/fail, published as a verdict artifact
      criteria-exec: true                  # validates the audit artifacts (same code the tests job runs)

  sign:
    # Signing needs id-token/attestations. A *called* job may only request a permission its caller
    # grants, so requiring it inside the reusable workflow would break every existing consumer with
    # a zero-job startup failure. This job is this repo's reference for how to sign in your own repo;
    # private repos additionally need Enterprise Cloud for artifact attestations.
    needs: self-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write       # OIDC token the attestation is issued against
      attestations: write   # publish the attestation to this repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: saaf-tripwire-verdict
          path: verdict
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: verdict/tripwire-verdict.json
