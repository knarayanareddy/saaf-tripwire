# Reusable SAAF Tripwire workflow. Adopt it with examples/caller.yml.
name: SAAF Tripwire

on:
  workflow_call:
    inputs:
      tripwire-ref:
        description: Full 40-character commit SHA of saaf-tripwire to run (use the SHA you pinned this workflow to).
        type: string
        required: true
      fail-on:
        type: string
        default: high
      history:
        type: boolean
        default: true
      audit-dependencies:
        type: boolean
        default: false
      baseline:
        type: string
        default: ""

permissions: {}

jobs:
  tripwire:
    name: SAAF Tripwire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least privilege: read the code and the workflow run, write code-scanning alerts. Nothing else.
    # `actions: read` is required for the SARIF upload on private repositories (38 of the 51 SAAF repos).
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Refuse a mutable guard reference
        env:
          TW_REF: ${{ inputs.tripwire-ref }}
        run: |
          if ! printf '%s' "$TW_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tripwire-ref must be a full commit SHA, not a branch or tag"; exit 1
          fi

      - name: Check out the repository under test (full history for the secret scan)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Check out SAAF Tripwire at the pinned SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SAAF-Project/saaf-tripwire
          ref: ${{ inputs.tripwire-ref }}
          path: .tripwire-src
          persist-credentials: false

      - name: Run SAAF Tripwire
        uses: ./.tripwire-src
        with:
          path: target
          fail-on: ${{ inputs.fail-on }}
          history: ${{ inputs.history }}
          baseline: ${{ inputs.baseline }}
          audit-dependencies: ${{ inputs.audit-dependencies }}
