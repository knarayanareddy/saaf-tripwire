# Reusable SAAF Tripwire workflow. Adopt it with examples/caller.yml.
name: SAAF Tripwire

on:
  workflow_call:
    inputs:
      tripwire-ref:
        description: Full 40-character commit SHA of saaf-tripwire to run (use the SHA you pinned this workflow to).
        type: string
        required: true
      tripwire-repository:
        description: Repository that hosts the guard. Defaults to the upstream project; a fork or mirror passes its own repository.
        type: string
        default: SAAF-Project/saaf-tripwire
      fail-on:
        type: string
        default: high
      history:
        type: boolean
        default: true
      audit-dependencies:
        type: boolean
        default: false
      baseline:
        type: string
        default: ""
      criteria:
        description: Optional criteria manifest (relative to the repository) for per-criterion pass/fail.
        type: string
        default: ""
      criteria-exec:
        description: Allow test/command criteria checks to execute code from the repository.
        type: boolean
        default: false

permissions: {}

jobs:
  tripwire:
    name: SAAF Tripwire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least privilege: read the code and the workflow run, write code-scanning alerts. Nothing else.
    # `actions: read` is required for the SARIF upload on private repositories (38 of the 51 SAAF repos).
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Refuse a mutable guard reference
        env:
          TW_REF: ${{ inputs.tripwire-ref }}
        run: |
          if ! printf '%s' "$TW_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tripwire-ref must be a full commit SHA, not a branch or tag"; exit 1
          fi

      - name: Check out the repository under test (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Check out SAAF Tripwire at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.tripwire-repository }}
          ref: ${{ inputs.tripwire-ref }}
          path: .tripwire-src
          persist-credentials: false

      - name: Run SAAF Tripwire
        id: tripwire
        uses: ./.tripwire-src
        with:
          path: target
          fail-on: ${{ inputs.fail-on }}
          history: ${{ inputs.history }}
          baseline: ${{ inputs.baseline }}
          criteria: ${{ inputs.criteria }}
          criteria-exec: ${{ inputs.criteria-exec }}
          audit-dependencies: ${{ inputs.audit-dependencies }}

      - name: Upload the criteria verdict
        # A verdict that only exists in a log line is not evidence. Publish the JSON so a signer,
        # an auditor, or a downstream reviewer can read the same file the gate acted on.
        if: always() && steps.tripwire.outputs.verdict != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: saaf-tripwire-verdict
          path: ${{ steps.tripwire.outputs.verdict }}
          if-no-files-found: error
          retention-days: 30
