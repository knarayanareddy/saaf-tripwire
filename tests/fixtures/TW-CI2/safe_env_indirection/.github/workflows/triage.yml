on:
  pull_request_target:
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Echo title safely
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" >> summary.md
      - run: echo "${{ github.event.pull_request.head.repo.full_name }} ${{ needs.build.result }}"
