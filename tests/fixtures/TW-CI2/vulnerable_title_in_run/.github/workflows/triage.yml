name: triage
on:
  pull_request_target:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Echo title
        run: |
          echo "New PR"
          echo "${{ github.event.pull_request.title }}" >> summary.md
      - run: echo ${{github.head_ref}}
